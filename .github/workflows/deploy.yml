name: Deploy to Kubernetes (DigitalOcean)

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar kubectl y Kubeconfig de DigitalOcean
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.DO_KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Crear o actualizar Secret de MySQL en Kubernetes
        run: |
          kubectl create secret generic mysql-secret \
            --from-literal=MYSQL_ROOT_PASSWORD="${{ secrets.MYSQL_ROOT_PASSWORD }}" \
            --from-literal=MYSQL_DATABASE="${{ secrets.MYSQL_DATABASE }}" \
            --from-literal=MYSQL_USER="${{ secrets.MYSQL_USER }}" \
            --from-literal=MYSQL_PASSWORD="${{ secrets.MYSQL_PASSWORD }}" \
            -n backend --dry-run=client -o yaml | kubectl apply -f -

      - name: Crear o actualizar Secret de AWS en Kubernetes
        run: |
          kubectl create secret generic aws-credentials \
            --from-literal=AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
            --from-literal=AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            --from-literal=AWS_DEFAULT_REGION="${{ secrets.AWS_REGION }}" \
            -n backend --dry-run=client -o yaml | kubectl apply -f -

      - name: Desplegar manifiestos en el clúster
        run: |
          kubectl apply -f k8s/

      - name: Esperar a que el pod de MySQL esté listo
        run: |
          kubectl rollout status statefulset/mysql -n backend --timeout=120s

      - name: Inicializar datos en la Base de Datos
        run: |
          # 1. Obtener la contraseña actual guardada en el Secret de Kubernetes
          MYSQL_PASS=$(kubectl get secret mysql-secret -n backend -o jsonpath="{.data.MYSQL_PASSWORD}" | base64 --decode)
          
          # 2. Inyectar el script data/mysql_data.sql dentro del pod mysql-0
          kubectl exec -i mysql-0 -n backend -- mysql -u "${{ secrets.MYSQL_USER }}" -p"$MYSQL_PASS" -f "${{ secrets.MYSQL_DATABASE }}" < data/mysql_data.sql || true

      - name: Reiniciar Deployment del Backend para aplicar cambios
        run: |
          kubectl rollout restart deployment/backend -n backend
          kubectl rollout status deployment/backend -n backend --timeout=120s